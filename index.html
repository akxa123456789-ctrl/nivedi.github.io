<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Single Image Site</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      font-family: Arial, sans-serif;
    }

    .image-box {
      border: 6px solid #ffffff;   /* change border color */
      border-radius: 16px;
      overflow: hidden;
      animation: fadeZoom 1.2s ease;
    }

    .image-box img {
      width: 80vw;
      max-width: 600px;
      height: auto;
      display: block;
    }

    @keyframes fadeZoom {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>

  <div class="image-box">
    <img src="image.jpg" alt="My Image">
  </div>

</body>
</html>
